name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Dependency security audit
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); const entries=Object.entries(a.vulnerabilities||{}); for (const [name,v] of entries) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{name:x.name,title:x.title,url:x.url,range:x.range})})); if(a.error){console.error('npm audit falhou:',a.error.summary||a.error.code||'erro desconhecido');process.exit(1)} const blockers=entries.filter(([,v])=>v.severity==='critical'||v.severity==='high'); if(blockers.length){console.error(blockers.length+' dependência(s) com vulnerabilidade alta/crítica.');process.exit(1)} console.log(entries.length+' pacote(s) com avisos; nenhuma vulnerabilidade alta/crítica.');"
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
