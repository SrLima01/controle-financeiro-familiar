name: CI

on:
  push:
    branches: ["main", "phase/**", "release/**", "qa/**"]
  pull_request:
    branches: ["main", "release/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pin npm to stable version
        run: npm install --global npm@10.8.2
      - name: Clear npm cache
        run: npm cache clean --force
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps --prefer-online

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
